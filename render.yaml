services:
  - type: web
    name: ai-trader-api
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars: &ai_trader_env
      - key: AI_TRADER_API_TOKEN
        sync: false
      - key: AI_TRADER_PROCESS_ROLE
        value: render
      - key: AI_TRADER_DISABLE_API_BACKGROUND_WORKERS
        value: "true"
      - key: AI_TRADER_REQUIRE_POSTGRES_IN_HOSTED
        value: "true"
      - key: AI_TRADER_DATABASE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AUTO_PAPER_TRADING
        value: "true"
      - key: ALPACA_AUTO_TRADING
        value: "true"
      - key: KRAKEN_AUTO_TRADING
        value: "true"
      - key: COINBASE_AUTO_TRADING
        value: "false"
      - key: BINANCE_AUTO_TRADING
        value: "false"
      - key: IBKR_AUTO_TRADING
        value: "false"
      - key: AUTO_TRADE_MIN_CONFIDENCE
        value: "0.85"
      - key: AUTO_TRADE_MIN_PHILOSOPHY_FIT
        value: "0.85"
      - key: MAX_AUTO_TRADE_AMOUNT
        value: "25"
      - key: DEFAULT_STOP_LOSS_PCT
        value: "0.03"
      - key: MAX_STOP_LOSS_PCT
        value: "0.05"
      - key: CRYPTO_MAX_AUTO_TRADE_AMOUNT
        value: "10"
      - key: CRYPTO_DEFAULT_STOP_LOSS_PCT
        value: "0.02"
      - key: CRYPTO_MAX_STOP_LOSS_PCT
        value: "0.05"
      - key: KRAKEN_SANDBOX_MODE
        value: "true"
      - key: KRAKEN_TRADING_ENABLED
        value: "true"
      - key: KRAKEN_LIVE_TRADING_APPROVED
        value: "true"
      - key: KRAKEN_SUBMIT_REAL_ORDERS
        value: "true"
      - key: KRAKEN_TRADING_ALLOCATION_GBP
        value: "100"
      - key: KRAKEN_MAX_ORDER_GBP
        value: "5"
      - key: KRAKEN_MIN_ORDER_GBP
        value: "1"
      - key: KRAKEN_MAX_OPEN_TRADES
        # 2026-08-16: was "1", contradicting the July-marathon fix's stated intent of
        # 5 (commit b9199f32, "Fix the Kraken concentration check for the deployment's
        # real cap of 5, not 1") and MAX_OPEN_POSITIONS below -- three different values
        # (1 here, 3 in MAX_OPEN_POSITIONS, 5 intended) for "how many Kraken positions
        # can be open" is exactly the kind of drift the Founder asked to be checked
        # for. Aligned to 5 here so this and MAX_OPEN_POSITIONS agree with each other
        # and with the documented intent.
        value: "5"
      - key: KRAKEN_ALLOWED_PAIRS
        value: XBTGBP,ETHGBP,SOLGBP
      - key: KRAKEN_API_KEY
        sync: false
      - key: KRAKEN_PRIVATE_KEY
        sync: false
      - key: KRAKEN_API_SECRET
        sync: false
      - key: COINBASE_TRADING_ENABLED
        value: "false"
      - key: COINBASE_API_KEY
        sync: false
      - key: COINBASE_API_SECRET
        sync: false
      - key: COINBASE_API_PASSPHRASE
        sync: false
      - key: COINBASE_PORTFOLIO_ID
        sync: false
      - key: RESEARCH_SCHEDULER_ENABLED
        value: "false"
      - key: AI_TRADER_WORKER_RESEARCH_ENABLED
        value: "true"
      - key: AI_TRADER_PRODUCTION_SNAPSHOT_INTERVAL_SECONDS
        value: "1200"
      - key: AI_TRADER_WORKER_HEARTBEAT_INTERVAL_SECONDS
        value: "30"
      - key: AI_TRADER_BROKER_POLL_INTERVAL_SECONDS
        value: "600"
      - key: RESEARCH_SCHEDULER_INTERVAL_MINUTES
        value: "60"
      - key: RESEARCH_SCHEDULER_LIMIT
        value: "30"
      - key: AUTO_EXECUTION_INTERVAL_SECONDS
        value: "60"
      - key: PAPER_TRADING_ONLY
        value: "true"
      - key: MIN_CONFIDENCE_SCORE
        value: "0.85"
      - key: MAX_RISK_PER_TRADE_PCT
        value: "0.01"
      - key: MAX_DAILY_LOSS_PCT
        value: "0.03"
      - key: MAX_OPEN_POSITIONS
        # 2026-08-16: was "3" -- with exactly 3 Kraken positions already open
        # (XRP/ETH/BCH), this generic (broker-agnostic) guardrail check
        # (guardrails.py: len(account.open_positions) >= config.max_open_positions)
        # was hard-blocking every single new Kraken proposal regardless of coin or
        # quality, real-data-confirmed via the new /crypto-rejections-explained
        # digest. Raised to 5 to match KRAKEN_MAX_OPEN_TRADES above. Also applies to
        # Alpaca (this check is shared across brokers, not Kraken-specific) --
        # raising Alpaca's concurrent-position room too, which is a welcome side
        # effect, not an unwanted one, per this session's standing direction to
        # give Alpaca more room to actually trade.
        value: "5"

  - type: worker
    name: ai-trader-worker
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ai_trader run-worker --sleep-seconds 60
    envVars: *ai_trader_env

  # NOTE: premarket-equity, market-open-equity, midday-equity, market-close-equity,
  # overnight-crypto, and daily-report were REMOVED from here on 2026-07-27 (Phase 0 /
  # CRITICAL_REMEDIATION_PLAN.md P0-3). The always-on worker's own internal scheduler
  # (`cli.py:_due_worker_jobs`) already triggers every one of these jobs on its own
  # cadence. Running both a Render cron service and the worker loop for the same job
  # name double-scheduled research (most visibly `overnight-crypto`, which the worker
  # ran hourly on top of the cron's own 2-hourly schedule) and was a confirmed
  # contributor to the job timeouts investigated in
  # architecture/PRODUCTION_TIMEOUT_ROOT_CAUSE_ANALYSIS.md, because the two schedulers
  # compute different `scheduled_for` idempotency keys and never deduplicate against
  # each other. Do not re-add a cron service for any of these six job names without
  # also removing the corresponding entry from `_due_worker_jobs`, or the double
  # scheduling will return. `midday-equity` specifically has no worker-loop equivalent
  # by name, but its entire trading-hours window is already covered by the worker's
  # hourly `market-open-equity` research cadence, so no replacement job was added.

  - type: cron
    name: ai-trader-daily-learning
    env: docker
    schedule: "10 21 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ai_trader run-job daily-learning
    envVars: *ai_trader_env

  - type: cron
    name: ai-trader-weekly-report
    env: docker
    schedule: "45 21 * * 5"
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ai_trader run-job weekly-report --report-type weekly
    envVars: *ai_trader_env

  - type: cron
    name: ai-trader-monthly-report
    env: docker
    schedule: "15 22 1 * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ai_trader run-job monthly-report --report-type monthly
    envVars: *ai_trader_env
